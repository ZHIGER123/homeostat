$kind: http-request
url: "{{base_url}}/api/v1/playlists?user_id={{listener_id}}"
method: GET
headers:
  Accept: application/json
queryParams:
  user_id: "{{listener_id}}"
scripts:
  - type: afterResponse
    code: pm.test("Код ответа 200", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 2000
