$kind: http-request
url: "{{base_url}}/api/v1/admin/users/{{listener_id}}/block"
method: PUT
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("Код ответа 200", function () { pm.response.to.have.status(200); });
      pm.test("is_blocked = true", function () { pm.expect(pm.response.json().data.is_blocked).to.be.true; });
    language: text/javascript
order: 1000
