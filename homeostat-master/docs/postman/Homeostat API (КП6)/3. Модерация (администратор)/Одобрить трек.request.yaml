$kind: http-request
url: "{{base_url}}/api/v1/admin/tracks/{{track_id}}/status"
method: PATCH
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "published"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Код ответа 200", function () { pm.response.to.have.status(200); });
      pm.test("Статус published", function () { pm.expect(pm.response.json().data.status).to.eql("published"); });
    language: text/javascript
order: 3000
