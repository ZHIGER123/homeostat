$kind: http-request
url: "{{base_url}}/api/v1/admin/tracks"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("Код ответа 200", function () { pm.response.to.have.status(200); });
      pm.test("Все треки в очереди — pending", function () { pm.expect(pm.response.json().data.every(t => t.status === "pending")).to.be.true; });
    language: text/javascript
order: 1000
