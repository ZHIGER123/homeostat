$kind: http-request
url: "{{base_url}}/api/v1/tracks/{{track_id}}/comments"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "user_id": "{{listener_id}}",
      "body": "Отличный трек!"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Код ответа 201", function () { pm.response.to.have.status(201); });
      pm.collectionVariables.set("comment_id", pm.response.json().data.id);
    language: text/javascript
order: 3000
