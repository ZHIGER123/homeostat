$kind: http-request
url: "{{base_url}}/api/v1/genres"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Synthwave"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Код ответа 201", function () { pm.response.to.have.status(201); });
      pm.test("slug сформирован", function () { pm.expect(pm.response.json().data.slug).to.eql("synthwave"); });
      pm.collectionVariables.set("new_genre_id", pm.response.json().data.id);
    language: text/javascript
order: 2000
