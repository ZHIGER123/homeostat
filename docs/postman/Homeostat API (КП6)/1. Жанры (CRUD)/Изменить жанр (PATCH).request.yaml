$kind: http-request
url: "{{base_url}}/api/v1/genres/{{new_genre_id}}"
method: PATCH
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Retro Synthwave"
    }
scripts:
  - type: afterResponse
    code: pm.test("Код ответа 200", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 4000
