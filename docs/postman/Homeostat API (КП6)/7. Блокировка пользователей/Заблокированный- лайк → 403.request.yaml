$kind: http-request
name: "Заблокированный: лайк → 403"
url: "{{base_url}}/api/v1/users/{{listener_id}}/likes/{{track_id}}"
method: PUT
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("Код ответа 403", function () { pm.response.to.have.status(403); });
      pm.test("Формат ошибки {message}", function () { pm.expect(pm.response.json()).to.have.property("message"); });
    language: text/javascript
order: 2000
