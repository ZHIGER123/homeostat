$kind: http-request
url: "{{base_url}}/api/v1/playlists/{{playlist_id}}/tracks"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "track_id": "{{track_id}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Код ответа 409", function () { pm.response.to.have.status(409); });
      pm.test("Формат ошибки {message}", function () { pm.expect(pm.response.json()).to.have.property("message"); });
    language: text/javascript
order: 6000
