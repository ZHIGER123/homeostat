$kind: http-request
url: "{{base_url}}/api/v1/playlists/{{playlist_id}}/tracks"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "track_id": "{{track_id}}"
    }
scripts:
  - type: afterResponse
    code: pm.test("Код ответа 201", function () { pm.response.to.have.status(201); });
    language: text/javascript
order: 5000
