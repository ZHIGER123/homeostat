$kind: http-request
url: "{{base_url}}/api/v1/playlists/999999"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("Код ответа 404", function () { pm.response.to.have.status(404); });
      pm.test("Формат ошибки {message}", function () { pm.expect(pm.response.json()).to.have.property("message"); });
    language: text/javascript
order: 3000
